  <title>Skorton – Papan Skor Badminton Online Gratis</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap');
    :root{
      color-scheme:light dark;
      --bg:#eef3ef;--surface:#fff;--surface-2:#e4ebe6;--ink:#10221a;--muted:#4f6359;
      --line:#cad6cf;--court:#0d533d;--court-deep:#0b3528;--volt:#c9ff38;--volt-ink:#153300;
      --orange:#ff7438;--red:#d7473f;--shadow:0 18px 48px rgba(10,44,31,.13);
      --radius-lg:26px;--radius-md:17px;--radius-sm:10px;
    }
    @media(prefers-color-scheme:dark){:root{--bg:#07140f;--surface:#0e2119;--surface-2:#163126;--ink:#f0f7f3;--muted:#afc2b8;--line:#29483a;--court:#116347;--court-deep:#092c21;--shadow:0 20px 55px rgba(0,0,0,.3)}}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--orange);outline-offset:3px}a{color:inherit}
    .shell{min-height:100vh}.wrap{width:min(1120px,calc(100% - 36px));margin:auto}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    .topbar{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid color-mix(in srgb,var(--line) 65%,transparent)}

  function feature(icon,title,text){return '<article class="feature">'+icon+'<h3>'+title+'</h3><p>'+text+'</p></article>'}
  function setup(){return topbar('Pengaturan pertandingan')+'<main class="wrap page"><div class="page-head"><div><h1>Siapkan pertandingan</h1><p>Isi nama pemain, format pertandingan, dan tim yang servis lebih dulu.</p></div></div><div class="setup-grid"><form class="panel" id="setupForm" autocomplete="off"><div class="form-grid"><div class="field full"><label>Jenis pertandingan</label><div class="toggle-row"><button type="button" class="toggle active" data-mode="singles">Tunggal</button><button type="button" class="toggle" data-mode="doubles">Ganda</button></div><input type="hidden" id="mode" value="singles"></div><div class="field"><label for="teamA">Pemain / tim A</label><input class="input" id="teamA" maxlength="28" placeholder="Pemain A" required></div><div class="field double-field" hidden aria-hidden="true"><label for="a2">Pasangan Pemain A</label><input class="input" id="a2" maxlength="28" placeholder="Pasangan Pemain A"></div><div class="field"><label for="teamB">Pemain / tim B</label><input class="input" id="teamB" maxlength="28" placeholder="Pemain B" required></div><div class="field double-field" hidden aria-hidden="true"><label for="b2">Pasangan Pemain B</label><input class="input" id="b2" maxlength="28" placeholder="Pasangan Pemain B"></div><div class="field"><label for="bestOf">Format pertandingan</label><select id="bestOf"><option value="3">Menang 2 game (maksimal 3)</option><option value="5">Menang 3 game (maksimal 5)</option><option value="1">1 game saja</option></select></div><div class="field"><label for="firstServe">Servis pertama</label><select id="firstServe"><option value="A">Tim A</option><option value="B">Tim B</option></select></div><div class="field full"><label for="eventName">Nama kegiatan (opsional)</label><input class="input" id="eventName" maxlength="42" placeholder="Contoh: Latihan Jumat"></div><div class="field full"><button class="btn btn-main" type="submit">Mulai pertandingan</button></div></div></form><aside class="panel setup-aside"><div><h2>Aturan skor</h2><div class="rule-list"><div class="rule-item"><i></i><span>Game sampai 21 poin, selisih 2 poin, maksimal 30 poin.</span></div><div class="rule-item"><i></i><span>Interval saat salah satu tim mencapai 11 poin dan jeda antar-game.</span></div><div class="rule-item"><i></i><span>Sisi kanan untuk skor genap dan sisi kiri untuk skor ganjil.</span></div><div class="rule-item"><i></i><span>Poin terakhir dapat dibatalkan jika skor salah dicatat.</span></div></div></div><small>Riwayat tersimpan otomatis di perangkat ini.</small></aside></div></main>'+footer()}
  function newMatch(cfg){return {id:Date.now(),mode:cfg.mode,teams:{A:{name:cfg.a,players:cfg.mode==='doubles'?[cfg.a,cfg.a2]:[cfg.a]},B:{name:cfg.b,players:cfg.mode==='doubles'?[cfg.b,cfg.b2]:[cfg.b]}},bestOf:cfg.bestOf,event:cfg.event||'',referee:cfg.referee||'',device:cfg.device||'',scores:{A:0,B:0},games:{A:0,B:0},sets:[],serve:cfg.serve,firstServe:cfg.serve,court:{A:{right:0,left:1},B:{right:0,left:1}},elapsed:0,running:true,started:Date.now(),lastTick:Date.now(),undo:[],interval11:false,complete:false,winner:null,courtCollapsed:false,tournamentMatchId:cfg.tournamentMatchId||null}}
  function clock(sec){sec=Math.max(0,sec||0);var m=Math.floor(sec/60),s=sec%60;return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}
  function tick(){if(state.match&&state.match.running&&!state.match.complete){var now=Date.now(),add=Math.floor((now-state.match.lastTick)/1000);if(add>0){state.match.elapsed+=add;state.match.lastTick+=add*1000;var el=document.querySelector('[data-timer]');if(el)el.textContent=clock(state.match.elapsed);var lel=document.querySelector('[data-live-timer]');if(lel)lel.textContent=clock(state.match.elapsed)}}}
  function ensureTimer(){clearInterval(state.timerId);state.timerId=setInterval(tick,500)}
  function playerAtSide(m,team,side){var players=m.teams[team].players;if(players.length===1)return players[0];var positions=m.court&&m.court[team]?m.court[team]:{right:0,left:1};return players[positions[side]]||players[0]}
  function displayTeam(m,team){var players=m.teams[team].players.filter(Boolean);return players.join(' / ')||m.teams[team].name}
  function currentServer(m){var t=m.serve,other=t==='A'?'B':'A',side=m.scores[t]%2===0?'right':'left';return {team:t,player:playerAtSide(m,t,side),receiver:playerAtSide(m,other,side),side:side==='right'?'kanan':'kiri',sideKey:side}}
  function matchCourt(m,s){var other=s.team==='A'?'B':'A';function position(team,side){if(team==='A')return side==='right'?'top-left':'top-right';return side==='left'?'bottom-left':'bottom-right'}function marker(team,side){if(m.mode==='singles'&&side!==s.sideKey)return '';var role=team===s.team&&side===s.sideKey?' server':team===other&&side===s.sideKey?' receiver':'',caption=role.indexOf('server')>-1?'SERVIS':role.indexOf('receiver')>-1?'TERIMA':'';return '<span class="court-player '+position(team,side)+role+'"><span>'+safe(playerAtSide(m,team,side))+'</span>'+(caption?'<small>'+caption+'</small>':'')+'</span>'}var markers=marker('A','right')+marker('A','left')+marker('B','left')+marker('B','right'),x1=s.team==='A'?(s.sideKey==='right'?28:72):(s.sideKey==='right'?72:28),x2=other==='A'?(s.sideKey==='right'?28:72):(s.sideKey==='right'?72:28),y1=s.team==='A'?24:76,y2=other==='A'?24:76;return '<div class="match-court-panel'+(m.courtCollapsed?' collapsed':'')+'"><div class="match-court-head"><div class="service-route" aria-label="Servis berikutnya: '+safe(s.player)+' ke '+safe(s.receiver)+' dari sisi '+s.side+'"><span class="service-route-icon" aria-hidden="true">'+icons.serve+'</span><strong>'+safe(s.player)+'</strong><i aria-hidden="true">→</i><strong>'+safe(s.receiver)+'</strong><b>'+s.side+'</b></div><div class="match-court-actions"><button type="button" class="court-collapse" data-toggle-court aria-expanded="'+String(!m.courtCollapsed)+'">'+(m.courtCollapsed?'Tampilkan':'Sembunyikan')+'</button></div></div><div class="match-court" aria-label="'+safe(s.player)+' servis kepada '+safe(s.receiver)+' dari sisi '+s.side+'"><div class="court-lines" aria-hidden="true"><i class="center-vertical"></i><i class="short-top"></i><i class="short-bottom"></i><i class="back-top"></i><i class="back-bottom"></i><i class="net"></i></div><span class="court-end-label top">'+safe(displayTeam(m,'A'))+'</span><span class="court-end-label bottom">'+safe(displayTeam(m,'B'))+'</span><svg class="service-flight" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><defs><marker id="serve-tip" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L0,7 L7,3.5 z" fill="currentColor"></path></marker></defs><line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" marker-end="url(#serve-tip)"></line></svg>'+markers+'</div></div>'}
  function score(){var m=state.match;if(!m)return home();var s=currentServer(m),needed=Math.ceil(m.bestOf/2),rows='';for(var i=0;i<Math.max(3,m.sets.length+1);i++){var set=m.sets[i],active=i===m.sets.length&&!m.complete;rows+='<div class="set-row"><span>'+ (active?'Game '+(i+1):set?'Game '+(i+1):'—')+'</span><b>'+(set?set.A:active?m.scores.A:'')+'</b><b>'+(set?set.B:active?m.scores.B:'')+'</b><b>'+(set?set.winner:active?'•':'')+'</b></div>'}
    return topbar('Pertandingan berlangsung')+'<main class="wrap page match-page"><div class="score-layout"><section class="scoreboard"><div class="score-top"><div class="match-meta">GAME '+(m.sets.length+1)+' · MENANG '+needed+' GAME<br>'+(m.event?safe(m.event):m.mode==='doubles'?'GANDA':'TUNGGAL')+'</div><div class="timer" data-timer>'+clock(m.elapsed)+'</div></div>'+matchCourt(m,s)+'<div class="teams"><article class="team-card '+(m.serve==='A'?'serving':'')+'"><div class="team-head"><div><div class="team-name">'+safe(displayTeam(m,'A'))+'</div></div><span class="service-tag">SERVIS</span></div><div class="score-number">'+m.scores.A+'</div><button class="score-add" data-point="A">+1 poin</button></article><article class="team-card '+(m.serve==='B'?'serving':'')+'"><div class="team-head"><div><div class="team-name">'+safe(displayTeam(m,'B'))+'</div></div><span class="service-tag">SERVIS</span></div><div class="score-number">'+m.scores.B+'</div><button class="score-add" data-point="B">+1 poin</button></article></div></section><aside class="score-side"><div class="side-box"><h3>Skor per game</h3><div class="set-row"><span>Tim</span><b>A</b><b>B</b><b>W</b></div>'+rows+'</div><div class="side-box"><h3>Kontrol wasit</h3><div class="side-actions"><button class="btn btn-alt" data-action="undo" '+(m.undo.length?'':'disabled')+'>Batalkan poin</button><button class="btn btn-alt" data-action="timer">'+(m.running?'Jeda timer':'Lanjut timer')+'</button><button class="btn btn-alt" data-action="live">Buka Live Score</button><button class="btn btn-alt" data-action="end">Akhiri pertandingan</button></div></div><div class="side-box"><h3>Status</h3><div class="status-line">'+(m.scores.A===20&&m.scores.B===20?'Deuce. Harus unggul 2 poin, maksimal sampai 30.':'Tim A butuh '+(needed-m.games.A)+' game lagi · Tim B butuh '+(needed-m.games.B)+' game lagi')+'</div></div></aside></div></main>'+footer()}
  function point(team){var m=state.match;if(!m||m.complete||state.intervalEndsAt)return;m.undo.push(JSON.stringify({scores:m.scores,games:m.games,sets:m.sets,serve:m.serve,court:m.court,interval11:m.interval11}));var servingWon=team===m.serve;m.scores=Object.assign({},m.scores);m.scores[team]++;if(servingWon&&m.mode==='doubles'){var priorRight=m.court[team].right;m.court[team].right=m.court[team].left;m.court[team].left=priorRight}m.serve=team;var a=m.scores.A,b=m.scores.B,triggerInterval=!m.interval11&&(a===11||b===11);if(triggerInterval)m.interval11=true;
    var win=(a>=21||b>=21)&&(Math.abs(a-b)>=2||a===30||b===30);if(win){var winner=a>b?'A':'B';m.games=Object.assign({},m.games);m.games[winner]++;m.sets=m.sets.concat([{A:a,B:b,winner:winner}]);var need=Math.ceil(m.bestOf/2);if(m.games[winner]>=need){completeMatch(winner)}else{m.scores={A:0,B:0};m.interval11=false;m.serve=winner;showModal(safe(displayTeam(m,winner))+' menang di game ini','Skor '+a+'–'+b+'. Berikutnya, game '+(m.sets.length+1)+'.','Mulai game '+(m.sets.length+1))}}render();if(triggerInterval&&!win)beginIntervalCountdown(a,b)}
  function undo(){var m=state.match;if(!m||!m.undo.length)return;var prev=JSON.parse(m.undo.pop());m.scores=prev.scores;m.games=prev.games;m.sets=prev.sets;m.serve=prev.serve;m.court=prev.court||m.court;m.interval11=prev.interval11;toast('Poin terakhir dibatalkan');render()}
  function completeMatch(winner){var m=state.match;m.complete=true;m.winner=winner;m.running=false;m.finished=Date.now();state.history.unshift(JSON.parse(JSON.stringify(m)));if(m.tournamentMatchId)advanceTournament(m.tournamentMatchId,m.teams[winner].name);confetti();showResult(m)}
  function showModal(title,text,button){modalContent.innerHTML='<h2 id="modalTitle">'+title+'</h2><p>'+text+'</p><div class="modal-actions centered"><button class="btn btn-main" data-close-modal>'+button+'</button></div>';modal.classList.add('open');modal.setAttribute('aria-hidden','false')}
  function beginIntervalCountdown(a,b){clearInterval(state.intervalTimerId);state.intervalResumeRunning=!!(state.match&&state.match.running);if(state.match)state.match.running=false;state.intervalEndsAt=Date.now()+60000;modalContent.innerHTML='<h2 id="modalTitle">Interval</h2><div class="interval-panel"><div class="interval-score">Skor '+a+'–'+b+'</div><div class="interval-clock" data-interval-ring><strong data-interval-clock>01:00</strong></div><p class="interval-label">Waktu istirahat berjalan otomatis. Pertandingan dapat dilanjutkan sebelum hitungan selesai.</p></div><div class="modal-actions centered"><button class="btn btn-main" data-finish-interval>Lanjut pertandingan</button></div>';modal.classList.add('open');modal.setAttribute('aria-hidden','false');var finishButton=modalContent.querySelector('[data-finish-interval]');if(finishButton)finishButton.onclick=finishIntervalCountdown;updateIntervalCountdown();state.intervalTimerId=setInterval(updateIntervalCountdown,250)}
  function updateIntervalCountdown(){if(!state.intervalEndsAt)return;var remaining=Math.max(0,Math.ceil((state.intervalEndsAt-Date.now())/1000)),clockEl=modalContent.querySelector('[data-interval-clock]'),ring=modalContent.querySelector('[data-interval-ring]');if(clockEl)clockEl.textContent=clock(remaining);if(ring)ring.style.setProperty('--interval-progress',(remaining/60*100)+'%');if(remaining<=0)finishIntervalCountdown()}
  function finishIntervalCountdown(){if(!state.intervalEndsAt)return;clearInterval(state.intervalTimerId);state.intervalTimerId=null;state.intervalEndsAt=null;modal.classList.remove('open');modal.setAttribute('aria-hidden','true');if(state.match&&!state.match.complete){state.match.running=state.intervalResumeRunning;state.match.lastTick=Date.now()}state.intervalResumeRunning=false;render();toast('Interval selesai')}
  function closeModal(){if(state.intervalEndsAt){finishIntervalCountdown();return}modal.classList.remove('open');modal.setAttribute('aria-hidden','true')}
  function liveView(){var m=state.match,s=currentServer(m);live.innerHTML='<div class="live-top"><span>GAME '+(m.sets.length+1)+' · SKOR GAME '+m.games.A+'–'+m.games.B+'</span><button class="nav-btn" data-close-live>Tutup</button></div><div class="live-score"><div class="live-team"><strong>'+m.scores.A+'</strong><span>'+safe(displayTeam(m,'A'))+'</span></div><i>VS</i><div class="live-team"><strong>'+m.scores.B+'</strong><span>'+safe(displayTeam(m,'B'))+'</span></div></div><div class="live-serve">'+safe(s.player)+' servis dari sisi '+s.side+' · <span data-live-timer>'+clock(m.elapsed)+'</span></div>';live.classList.add('open');live.setAttribute('aria-hidden','false')}
  function closeLive(){live.classList.remove('open');live.setAttribute('aria-hidden','true')}
  function resultMarkup(m){var sets=m.sets.map(function(x,i){return '<span>Game '+(i+1)+' · '+x.A+'–'+x.B+'</span>'}).join('');return '<article class="result-card" id="resultCard"><div class="result-brand"><span style="display:flex;align-items:center;gap:9px">'+brandMark()+'<b>SKORTON</b></span><span>KARTU HASIL</span></div><div class="result-body"><div class="result-title">Hasil akhir pertandingan</div><div class="result-winner">Pemenang · '+safe(displayTeam(m,m.winner))+'</div><div class="result-match"><div class="result-side"><strong>'+safe(displayTeam(m,'A'))+'</strong></div><div class="result-total">'+m.games.A+'–'+m.games.B+'</div><div class="result-side"><strong>'+safe(displayTeam(m,'B'))+'</strong></div></div><div class="result-sets">'+sets+'</div><div class="result-foot"><span>'+safe(m.event||'Pertandingan badminton')+'</span><span>Durasi '+clock(m.elapsed)+'<br>Skorton by Panser Digital Indonesia</span></div></div></article>'}
  function resultPage(m){return topbar('Kartu hasil pertandingan')+'<main class="wrap page"><div class="page-head"><div><h1>Hasil pertandingan</h1><p>'+safe(displayTeam(m,m.winner))+' menang dengan skor game '+m.games[m.winner]+'–'+m.games[m.winner==='A'?'B':'A']+'.</p></div></div>'+resultMarkup(m)+'<div class="result-actions"><button class="btn btn-main" data-download-result>Unduh kartu hasil</button>'+(m.tournamentMatchId?'<button class="btn btn-alt" data-go="tournament">Kembali ke turnamen</button>':'<button class="btn btn-alt" data-go="setup">Catat pertandingan baru</button>')+'</div></main>'+footer()}

  function tournamentSetup(){var rows='';for(var i=0;i<4;i++)rows+=participantFields(i,'singles');return topbar('Turnamen')+'<main class="wrap page"><div class="page-head"><div><h1>Buat turnamen</h1><p>Isi data turnamen dan peserta. Skorton akan menyusun bagan sistem gugur.</p></div></div><form class="panel" id="tourneyForm" autocomplete="off"><div class="form-grid"><div class="field full"><label for="tourneyName">Nama turnamen</label><input class="input" id="tourneyName" maxlength="42" required placeholder="Contoh: Piala Komunitas 2026"></div><div class="field"><label for="tourneyDate">Tanggal (opsional)</label><input class="input" type="date" id="tourneyDate"></div><div class="field"><label for="tourneyLocation">Lokasi (opsional)</label><input class="input" id="tourneyLocation" maxlength="42" placeholder="Gedung atau kota"></div><div class="field full"><label>Kategori</label><div class="toggle-row"><button type="button" class="toggle active" data-tourney-mode="singles">Tunggal</button><button type="button" class="toggle" data-tourney-mode="doubles">Ganda</button></div><input type="hidden" id="tourneyMode" value="singles"></div></div><section class="tourney-section"><div class="tourney-section-head"><div><h2>Format turnamen</h2><p>Pilih format yang akan digunakan.</p></div></div><div class="format-choice"><button type="button" class="format-option active"><strong>Sistem Gugur</strong><small>Peserta yang kalah langsung tereliminasi.</small></button><button type="button" class="format-option" disabled><strong>Round Robin <em>Segera hadir</em></strong><small>Setiap peserta bertemu satu sama lain.</small></button><button type="button" class="format-option" disabled><strong>Grup + Knockout <em>Segera hadir</em></strong><small>Babak grup dilanjutkan ke fase gugur.</small></button></div></section><section class="tourney-section"><div class="tourney-section-head"><div><h2>Peserta</h2><p>Isi minimal 4 peserta. Nama peserta tidak boleh sama.</p></div><button type="button" cl
